// ---------- motion helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, k) => a + (b - a) * k
const outCubic = k => 1 - Math.pow(1 - k, 3)
const inOutCubic = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
const outBack = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2) }
const prog = (t, at, dur) => clamp((t - at) / dur)
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const sp = (text, cls = 'fg', extra = '') => `<span class="${cls}"${extra}>${esc(text)}</span>`
const SEP = sp(' │ ', 'dim')
const levelColor = p => (p >= 80 ? '#f85149' : p >= 50 ? '#d29922' : '#3fb950')
const levelCls = p => (p >= 80 ? 'red' : p >= 50 ? 'yellow' : 'green')

// A line that fades and rises in at `at`.
const appear = (t, at, inner, dur = 260) => {
  const k = outCubic(prog(t, at, dur))
  if (k <= 0) return ''
  return `<div class="row" style="opacity:${k};transform:translateY(${(1 - k) * 7}px)">${inner}</div>`
}
// Typed text: chars per second from `at`; returns [shown, done].
const typed = (t, at, text, cps = 26) => {
  const n = Math.floor(clamp((t - at) / 1000 * cps, 0, text.length))
  return [text.slice(0, n), n >= text.length]
}
const caret = (t, solid) => (solid || Math.floor(t / 530) % 2 === 0 ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>')
// A smooth meter: track of ░ with a clipped █ fill of the given percent.
const meter = (pct, cells = 10) => {
  const w = `${cells}ch`
  return `<span class="meter" style="width:${w}"><span class="track" style="color:${levelColor(pct)}">${'░'.repeat(cells)}</span><span class="fill" style="width:${(clamp(pct, 0, 100) / 100) * cells}ch;color:${levelColor(pct)}">${'█'.repeat(cells)}</span></span>`
}
// A value that flips from `a` to `b` at `at` (slides up).
const flip = (t, at, a, b, cls) => {
  const k = inOutCubic(prog(t, at, 320))
  if (k <= 0) return sp(a, cls)
  if (k >= 1) return sp(b, cls)
  return `<span class="flip ${cls}"><span style="transform:translateY(${-23 * k}px);opacity:${1 - k}">${esc(a)}</span><span style="position:absolute;left:0;top:0;transform:translateY(${23 * (1 - k)}px);opacity:${k}">${esc(b)}</span></span>`
}

// ---------- pieces ----------
// A plain button under the pointer: inverted, as the terminal draws it.
const hov = k => (k ? ` style="background:rgba(230,237,243,${0.9 * k});color:${k > 0.5 ? '#0d1117' : '#e6edf3'}"` : '')
function hud(o) {
  const { ctx = 18, tokens = '180k', lim = 23, cacheHtml, working = false, folder = 'D:\\projects\\my-app', glow = 0, folderHover = 0, branchHover = 0, shotHover = 0, dirty = 2 } = o
  const cache = cacheHtml ?? (working ? sp(T.cache_run, 'green') : sp(T.cache(47), 'green'))
  const fstyle = folderHover ? ` style="background:rgba(230,237,243,${0.9 * folderHover});color:${folderHover > 0.5 ? '#0d1117' : '#e6edf3'}"` : ''
  const rows = [
    sp('Opus 5.5', 'cyan b') + SEP + `<span id="folder" class="fg"${fstyle}>${esc(folder)}</span>` + SEP + `<span id="branch" class="fg"${hov(branchHover)}>⎇ main</span>` + sp(` ●${dirty}`, 'yellow') + sp(' ↑1', 'cyan') +
      SEP + '📷 ' + `<span id="shotbtn" class="fg"${hov(shotHover)}>${esc(T.shot_btn)}</span>` + sp(' · ', 'dim') + sp(T.shot_win, 'fg'),
    sp(T.context + ' ', 'dim') + meter(ctx) + ' ' + sp(`${Math.round(ctx)}%`, levelCls(ctx)) + sp(` (${tokens}/1.0M)`, 'dim') + SEP +
      sp(T.limit5 + ' ', 'dim') + meter(lim) + ' ' + sp(`${Math.round(lim)}%`, levelCls(lim)) + '  ' + sp('↻ ', 'cyan') + sp(T.reset5, 'fg b'),
    sp(T.week + ' ', 'dim') + sp('81%', 'red') + '  ' + sp('↻ ', 'cyan') + sp(T.resetw, 'fg b') + SEP + cache,
  ]
  const g = glow > 0 ? ` style="box-shadow:0 0 0 2px rgba(217,119,87,${glow}),0 0 26px rgba(217,119,87,${0.45 * glow});background:rgba(217,119,87,${0.06 * glow})"` : ''

function terminal({ transcript = '', trOpacity = 1, band = '', bandK = 0, prompt = '', h = hud({}), toast = null, overlay = '', title = 'claude — D:\\projects\\my-app' }) {

  const dimTr = 1 - 0.6 * glow
  const lim = lerp(23, 24, inOutCubic(prog(t, 1700, 600)))
  const fh = outCubic(prog(t, 4200, 150)) * (1 - prog(t, 4700, 200))
  const tr = appear(t, 0, tool('Edit', 'src/router.ts')) + appear(t, 200, result('+6 −2')) + appear(t, 400, say(sp(T.done)))
  // dialog
  let overlay = ''
  const dk = prog(t, 4650, 320), dOut = 1 - inOutCubic(prog(t, 7050, 220))
  if (dk > 0 && dOut > 0) {
    const folders = ['my-app', 'other-project', 'notes', 'scripts', 'website']
    const selY = lerp(0, 28, inOutCubic(prog(t, 5300, 380)))
    const bh = outCubic(prog(t, 6600, 150)), bp = Math.sin(Math.PI * prog(t, 6900, 180))
    const items = folders.map(f => `<div class="it">📁 ${f}</div>`).join('')
    overlay = `<div class="ov dlg" style="opacity:${outCubic(dk) * dOut};transform:scale(${lerp(0.95, 1, outBack(dk)) * lerp(0.97, 1, dOut)})"><div class="t">${esc(T.picker_title)}</div><div class="addr">D:\\projects</div>
<div class="side">★ ${esc(T.quick)}<br>🖥 ${esc(T.this_pc)}<br>💽 C:<br>💽 D:</div><div class="list"><div class="sel" style="top:${selY}px"></div><div style="position:relative">${items}</div></div>
<div class="foot"><span class="b1" id="sel" style="${bh ? `outline:2px solid rgba(0,62,115,${bh});` : ''}transform:scale(${1 - 0.05 * bp})">${esc(T.select_folder)}</span><span class="b2">${esc(T.cancel)}</span></div></div>`
  }
  const wk = prog(t, 7250, 380)
  if (wk > 0) {
    const [typedClaude, typedDone] = typed(t, 7700, 'claude', 14)
    const after = outCubic(prog(t, 8400, 300)), hudIn = outCubic(prog(t, 8800, 300))
    overlay += `<div class="ov win2" style="opacity:${outCubic(wk)};transform:scale(${lerp(0.9, 1, outBack(wk))});transform-origin:0% 100%"><div class="bar">${winDots}<span class="ttl">cmd — D:\\projects\\other-project · ${esc(T.new_window)}</span></div><div class="body">
<div class="row">${sp('D:\\projects\\other-project>', 'fg')}${sp(typedClaude, 'fg b')}${t < 8400 ? caret(t, !typedDone) : ''}</div><div class="row"></div>
<div class="row" style="opacity:${after}">${sp('✻ ', 'cyan')}${sp('Claude Code', 'fg b')}${sp('  ' + T.welcome, 'dim')}</div><div class="row"></div>
<div class="row" style="opacity:${hudIn}">${sp('❯ ', 'magenta')}</div>
<div class="row" style="opacity:${hudIn}">${sp('Opus 5.5', 'cyan b')}${SEP}${sp('D:\\projects\\other-project')}${SEP}${sp('⎇ main', 'magenta')}</div></div></div>`
  }
  S.cursor = [{ at: 3500, dur: 700, target: 'folder' }, { at: 5800, dur: 750, target: 'sel' }]
  S.clicks = [4500, 6900]
  S.cursorOut = 7300
  return {
    html: terminal({
      transcript: tr, trOpacity: dimTr, overlay,
      h: hud({ lim, glow, folderHover: fh, cacheHtml: LANG === 'ru' ? sp('кэш ', 'green') + flip(t, 1700, '47', '46', 'green') + sp(' мин', 'green') : sp('cache ', 'green') + flip(t, 1700, '47', '46', 'green') + sp('m', 'green') }),
    }),
  }
})

// 13. End card
scene(4400, null, t => {
  const k = outCubic(prog(t, 0, 500)), out = 1 - inOutCubic(prog(t, 4000, 400))
  const cmd = '/plugin install hud --marketplace ArtyaEXE/claude-mods'
  const [shown, done] = typed(t, 700, cmd, 40)
  const url = outCubic(prog(t, 2300, 500))
  return {
    html: `<div class="title" style="opacity:${out}"><h1 style="opacity:${k};transform:translateY(${(1 - k) * 16}px)">claude-mods</h1><p style="opacity:${k}">${esc(T.install)}</p>
<div class="cmd" style="opacity:${k}"><span style="color:#d2a8ff">❯ </span>${esc(shown)}${caret(t, !done)}</div>
<p style="font-size:22px;color:#58a6ff;opacity:${url};transform:translateY(${(1 - url) * 10}px)">github.com/ArtyaEXE/claude-mods</p></div>`,
    terminal: false,
  }
})

const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0)

// ---------- frame ----------
function captionHtml(si, lt) {
  const sc = SCENES[si]
  if (!sc.cap) return ''
  const prev = si > 0 ? SCENES[si - 1].cap : null
  const items = []
  const both = (from, to, k) => {
    if (from) items.push(`<div class="capi" style="opacity:${1 - k};transform:translateY(${-14 * k}px)"><span class="step">${from.step}</span>${esc(from.text)}</div>`)
    items.push(`<div class="capi" style="opacity:${k};transform:translateY(${14 * (1 - k)}px)"><span class="step">${to.step}</span>${esc(to.text)}</div>`)
  }
  if (sc.cap.at2 && lt >= sc.cap.at2) both({ step: sc.cap.step, text: sc.cap.text }, { step: sc.cap.step, text: sc.cap.text2 }, inOutCubic(prog(lt, sc.cap.at2, 380)))
  else both(prev && prev.step ? { step: prev.step, text: prev.text2 || prev.text } : null, sc.cap, inOutCubic(prog(lt, 0, 420)))
  return `<div class="cap">${items.join('')}</div>`
}

function render(t) {
  t = ((t % TOTAL) + TOTAL) % TOTAL
  let si = 0, start = 0
  while (t >= start + SCENES[si].dur) { start += SCENES[si].dur; si++ }
  const lt = t - start
  const S = {}
  const out = SCENES[si].fn(lt, S)
  // Terminal scenes fade in at their start when following a card.
  const fromCard = si > 0 && !SCENES[si - 1].cap
  const fadeIn = out.terminal === false ? 1 : (fromCard ? outCubic(prog(lt, 0, 380)) : 1)
  const stage = document.getElementById('stage')
  stage.innerHTML = `${captionHtml(si, lt)}<div style="opacity:${fadeIn}">${out.html}</div>`
  // Cursor: moves between targets with easing, presses and ripples on clicks.
  if (S.cursor) {
    let pos = { ...cur }, visible = 0
    S.cursor.forEach((m, i) => {
      const key = `${si}:${i}`
      if (lt >= m.at) {
        if (!segFrom.has(key)) segFrom.set(key, { ...cur })
        const el = document.getElementById(m.target)
        if (el) {
          const r = el.getBoundingClientRect()
          const to = { x: r.left + Math.min(r.width * 0.5, 38), y: r.top + r.height * 0.62 }
          const k = inOutCubic(prog(lt, m.at, m.dur))
          const from = segFrom.get(key)
          pos = { x: lerp(from.x, to.x, k), y: lerp(from.y, to.y, k) }
          if (k >= 1) cur = { ...to }
        }
      }
    })
    if (lt < S.cursor[0].at) { pos = { x: 1040, y: 700 }; segFrom.delete(`${si}:0`); cur = { x: 1040, y: 700 } }
    visible = outCubic(prog(lt, S.cursor[0].at - 150, 250)) * (1 - inOutCubic(prog(lt, S.cursorOut, 300)))
    let scale = 1
    let ripples = ''
    for (const c of S.clicks || []) {
      scale -= 0.14 * Math.sin(Math.PI * prog(lt, c, 160))
      const k = prog(lt, c, 450)
      if (k > 0 && k < 1) {
        const rr = 6 + 26 * outCubic(k)
        ripples += `<div class="ripple" style="left:${pos.x - rr}px;top:${pos.y - rr}px;width:${rr * 2}px;height:${rr * 2}px;opacity:${1 - k}"></div>`
      }
    }
    stage.insertAdjacentHTML('beforeend', `${ripples}<div id="cursor" style="left:${pos.x}px;top:${pos.y}px;opacity:${visible};transform:scale(${scale})"><svg width="22" height="28" viewBox="0 0 22 28"><path d="M2 2 L2 22 L7.5 17 L11 25 L14.5 23.5 L11 15.5 L18 15.5 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg></div>`)
  }
}
window.TOTAL = TOTAL
window.render = render
render(Number(new URLSearchParams(location.search).get('t') || 0))
</script></body></html>
